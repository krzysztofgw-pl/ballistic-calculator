name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test solver
        run: ./gradlew :core:test
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Tolerate line breaks and spaces picked up when the secret was pasted.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64. Paste the whole content of ballistics-release.jks.base64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_PASSWORD" -alias kgwlabs-ballistics > /dev/null; then
            echo "::error::The keystore cannot be opened with SIGNING_PASSWORD, or it has no kgwlabs-ballistics key."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ballistics-apk
          path: app/build/outputs/apk/release/*.apk

  watch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Connect IQ watch app
        env:
          IMAGE: ghcr.io/matco/connectiq-tester:latest
        run: |
          # A throwaway developer key is enough for sideloading; the phone finds the app by its id.
          openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out garmin/developer_key.der -nocrypt
          docker pull -q "$IMAGE"
          echo "Devices in the image:"; docker run --rm --entrypoint ls "$IMAGE" /root/.Garmin/ConnectIQ/Devices | tr '\n' ' '; echo
          mkdir -p garmin/bin
          for device in $(grep -o 'product id="[^"]*"' garmin/manifest.xml | cut -d'"' -f2); do
            docker run --rm -v "$PWD/garmin:/app" -w /app --entrypoint monkeyc "$IMAGE" \
              -f monkey.jungle -d "$device" -o "bin/kgw-pressure-$device.prg" -y developer_key.der -r -w
          done
          ls -la garmin/bin
      - uses: actions/upload-artifact@v4
        with:
          name: kgw-pressure-watch-app
          path: garmin/bin/*.prg
