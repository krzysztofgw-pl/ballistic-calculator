name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test solver
        run: ./gradlew :core:test
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Tolerate line breaks and spaces picked up when the secret was pasted.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64. Paste the whole content of ballistics-release.jks.base64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_PASSWORD" -alias kgwlabs-ballistics > /dev/null; then
            echo "::error::The keystore cannot be opened with SIGNING_PASSWORD, or it has no kgwlabs-ballistics key."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: ballistics-apk
          path: app/build/outputs/apk/release/*.apk

  # Every build of main becomes the latest release. The asset keeps one name, so
  # releases/latest/download/ballistics.apk always gives the newest APK.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ballistics-apk
          path: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mv apk/*.apk apk/ballistics.apk
          gh release create "$TAG" apk/ballistics.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest --title "Build ${{ github.run_number }}" --notes "$NOTES"

  watch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Connect IQ watch app
        env:
          IMAGE: ghcr.io/matco/connectiq-tester:latest
          CIQ_KEY_BASE64: ${{ secrets.CIQ_DEVELOPER_KEY_BASE64 }}
        run: |
          # The store accepts updates only when they are signed with the same developer key, so the
          # key comes from a secret. Without it a throwaway key still gives .prg files for sideloading.
          if [ -n "$CIQ_KEY_BASE64" ]; then
            printf '%s' "$CIQ_KEY_BASE64" | tr -d ' \t\r\n' | base64 -d > garmin/developer_key.der
          else
            echo "::warning::CIQ_DEVELOPER_KEY_BASE64 is not set: signing with a throwaway key, the .iq cannot go to the store."
            openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out garmin/developer_key.der -nocrypt
          fi
          docker pull -q "$IMAGE"
          mkdir -p garmin/bin
          monkeyc() { docker run --rm -v "$PWD/garmin:/app" -w /app --entrypoint monkeyc "$IMAGE" "$@"; }
          for device in $(grep -o 'product id="[^"]*"' garmin/manifest.xml | cut -d'"' -f2); do
            monkeyc -f monkey.jungle -d "$device" -o "bin/kgw-pressure-$device.prg" -y developer_key.der -r -w
          done
          # The package uploaded to the Connect IQ store, for every watch in the manifest.
          monkeyc -e -f monkey.jungle -o bin/kgw-pressure.iq -y developer_key.der -r -w
          ls -la garmin/bin
      - uses: actions/upload-artifact@v6
        with:
          name: kgw-pressure-watch-app
          path: |
            garmin/bin/*.prg
            garmin/bin/*.iq
